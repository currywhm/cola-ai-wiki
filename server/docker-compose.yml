services:
  api:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8765}:8000"
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////app/data/llmwiki.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - api_data:/app/data
      - api_uploads:/app/uploads
      - ./cert:/app/cert:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  api_data:
  api_uploads:
